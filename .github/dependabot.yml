version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
  - package-ecosystem: "gitsubmodule"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      gitsubmodule:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
    ignore:
      # Dependabot moves submodules to the tip of the default branch, not to tags. Bump
      # v4-periphery by hand to a tagged release.
      - dependency-name: "lib/v4-periphery"
